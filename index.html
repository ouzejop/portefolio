    <script>



function animateConstellations() {
            const constellations = document.querySelectorAll('.constellation');
            constellations.forEach(constellation => {
                setInterval(() => {
                    constellation.classList.toggle('twinkle');
                }, Math.random() * 3000 + 2000); // Intervalle aléatoire entre 2 et 5 secondes
            });
        }

        window.onload = () => {
            createStars();
            createShootingStars();
            startCloudGeneration();
            animateConstellations();
        };



        function createStars() {
            const starsLayer = document.querySelector('.stars-layer');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDelay = Math.random() * 1 + 's';
                starsLayer.appendChild(star);
            }
        }

        function createShootingStars() {
            const starsLayer = document.querySelector('.stars-layer');
            setInterval(() => {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.top = Math.random() * 50 + 'vh';
                star.style.left = Math.random() * 100 + 'vw';
                starsLayer.appendChild(star);
                setTimeout(() => star.remove(), 3000);
            }, 4000);
        }

        function createCloud() {
            const cloudsLayer = document.querySelector('.clouds-layer');
            const sizes = ['small', 'medium', 'large'];
            const size = sizes[Math.floor(Math.random() * sizes.length)];
            
            const cloud = document.createElement('div');
            cloud.className = `cloud ${size}`;
            cloud.style.top = Math.random() * 70 + 'vh';
            cloud.style.opacity = 0.6 + Math.random() * 0.3;
            
            // Durée différente selon la taille
            const duration = size === 'small' ? 40 : size === 'medium' ? 50 : 60;
            cloud.style.animationDuration = (duration + Math.random() * 20) + 's';
            
            cloudsLayer.appendChild(cloud);
            
            // Supprimer le nuage après son passage
            setTimeout(() => cloud.remove(), duration * 1000);
        }

        function startCloudGeneration() {
            // Créer un nuage initial
            createCloud();
            
            // Programmer la création du prochain nuage
            setTimeout(() => {
                startCloudGeneration();
            }, 10000 + Math.random() * 20000); // Intervalle aléatoire entre 10 et 30 secondes
        }

        window.onload = () => {
            createStars();
            createShootingStars();
            startCloudGeneration();
        };
    </script>
